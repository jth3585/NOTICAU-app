name: iOS → TestFlight (local build, no EAS build quota)

# 수동 실행 전용. EAS '클라우드 빌드' 횟수를 쓰지 않고,
# GitHub의 macOS 러너에서 `eas build --local`로 IPA를 만든 뒤
# `eas submit`(무료)으로 TestFlight에 업로드한다.
on:
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # RN 0.81은 Xcode >= 16.1 필요. 러너 기본값이 낮을 수 있어 최신 안정판으로 고정.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      # buildNumber는 app.json에 직접 커밋된 값을 사용한다(동적 주입 제거 — 이전엔 주입이
      # 빌드에 반영 안 돼 매번 같은 값으로 나갔음). 빌드 전 커밋된 값을 로그로 확인.
      - name: Show committed iOS version/buildNumber
        run: node -e "const e=require('./app.json').expo;console.log('VERSION =',e.version,'| iOS buildNumber =',e.ios.buildNumber)"

      # Supabase 키는 EXPO_PUBLIC_* 로 빌드 시 인라인됨. .env는 커밋 안 하므로
      # CI에서 GitHub Secrets로 생성해 둔다. (없으면 앱이 Supabase에 연결 못 함)
      - name: Create .env from secrets
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Build IPA locally (no EAS build credit used)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --non-interactive --platform ios --profile production-ci --output "$RUNNER_TEMP/app.ipa"

      - name: Submit to TestFlight (free)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/app.ipa" --non-interactive

      - name: Upload IPA artifact (백업)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/app.ipa
          if-no-files-found: ignore
